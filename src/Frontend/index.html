<!doctype html><meta charset="utf-8">
<h1>URL Shortener</h1>
<form id="f">
    <input id="url" placeholder="https://example.com" required style="width:60%">
    <button>Shorten</button>
</form>
<p id="out"></p>
<script>
    const API = "https://<invoke-id>.execute-api.<region>.amazonaws.com/prod";
    document.getElementById('f').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const url = document.getElementById('url').value.trim();
        const r = await fetch(`${API}/shorten`, {
            method:'POST',
            headers:{'Content-Type':'application/json'/*,'x-api-key':'<key>' if enabled */},
            body: JSON.stringify({url})
        });
        const j = await r.json();
        document.getElementById('out').innerHTML = r.ok
            ? `<a href="${j.shortUrl}" target="_blank">${j.shortUrl}</a>`
            : `Error: ${j.error||'Unknown'}`;
    });
</script>
